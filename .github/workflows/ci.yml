name: CI

on:
  push:
    branches: [main, "pitch/**"]
  pull_request:

# Backtests run locally, never in CI (see CLAUDE.md). CI runs the invariant and
# unit/integration suites only.
jobs:
  schema:
    name: Prisma schema invariants
    runs-on: ubuntu-latest
    env:
      # validate does not connect, but prisma.config.ts reads these via env().
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sightline?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sightline?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate schema
        run: npm run prisma:validate
      - name: Schema-introspection invariants
        run: npm run test:schema

  web:
    name: Web app (lint, types, unit, build, e2e)
    runs-on: ubuntu-latest
    env:
      # Placeholders. The web suites never reach Postgres or Supabase — the
      # values exist only so `src/env.ts` parses, which is itself part of what
      # is under test. Nothing here is or may become a real credential.
      DATABASE_URL: postgresql://postgres:postgres@localhost:6543/sightline?pgbouncer=true
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sightline
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Format check
        run: npm run format
      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Install Playwright system dependencies
        run: |
          # Remove all Google apt sources before install-deps so apt-get update
          # does not hit Google's Chrome repo (intermittent hash mismatch on
          # GitHub Actions). Chromium binary is already installed above.
          sudo find /etc/apt/sources.list.d/ \
               /etc/apt/sources.list \
               /usr/share/keyrings/ \
               -maxdepth 1 \( -name '*google*' -o -name '*chrome*' \) \
               -delete 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get update -qq
          sudo npx playwright install-deps chromium
      # The authenticated suites (adversarial role enforcement, revocation
      # across devices, credential-failure parity) require a provisioned
      # Supabase project with seeded accounts. Without those secrets they
      # report as SKIPPED, never as passed — a green run that silently dropped
      # its most important assertions is worse than a red one.
      - name: End-to-end tests
        run: npm run test:e2e -- --project=desktop
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}

  perf-slate-lcp:
    name: Slate LCP (enforcing ≥30%)
    # Pitch 10 / SIG-99 flips SIG-91's harness from report-only to ENFORCING.
    # It captures /slate Largest Contentful Paint against the 300-contract perf
    # fixture and, with PERF_ENFORCE_LCP=1, FAILS the build unless the branch is
    # at least 30% faster than the committed baseline (RD-3). The build no longer
    # carries continue-on-error, so a genuine regression is a red build.
    #
    # Honesty invariant (do not weaken): the gate only produces a verdict when a
    # REAL baseline exists. `lcpCompare.comparabilityReason` refuses to compare
    # against the placeholder baseline (`measured: false`) and the spec returns
    # early — so enabling enforcement never manufactures a red or a green from a
    # null baseline. The real pre-change baseline is captured by the one-time
    # procedure in docs/v1/perf/README.md (run `npm run perf:slate-lcp` on the
    # pre-change commit in this same provisioned environment, commit the number),
    # after which every subsequent run enforces against it.
    #
    # Like the authenticated e2e suite the measurement needs a provisioned
    # environment: a Postgres database it can seed with the 300-contract fixture
    # and Supabase-backed accounts to sign in with. Absent the E2E_ADMIN_*
    # secrets the spec reports SKIPPED — never passed — so a fork/PR without the
    # secrets cannot silently turn the gate green.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sightline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sightline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sightline?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sightline?schema=public
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      APP_URL: http://localhost:3000
      # Enforce the ≥30% bar. Inert against a placeholder baseline (see above);
      # a live gate once the real baseline is committed.
      PERF_ENFORCE_LCP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # NEXT_PUBLIC_* values are baked into the build, so a real Slate LCP
      # measurement needs the REAL Supabase project at build time plus seeded
      # accounts to sign in with. When those provisioning secrets are absent the
      # whole gate is SKIPPED — every subsequent step is gated on this guard, so
      # the build is never run against empty env (which would fail env validation
      # before the measurement could even decide to skip). Honesty invariant: a
      # skipped gate is NEVER reported as passed, and is never failed on missing
      # infrastructure. Do not remove the guard to "make CI green".
      - name: Check perf environment is provisioned
        id: guard
        run: |
          if [ -n "${{ secrets.E2E_SUPABASE_URL }}" ] && [ -n "${{ secrets.E2E_ADMIN_EMAIL }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Slate LCP gate skipped::Perf provisioning secrets (E2E_SUPABASE_URL, E2E_ADMIN_*) are not configured, so the >=30% LCP gate cannot measure. Skipped — never reported as passed."
          fi
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci
      - name: Generate Prisma client
        if: steps.guard.outputs.ready == 'true'
        run: npm run prisma:generate
      - name: Apply migrations to the CI database
        if: steps.guard.outputs.ready == 'true'
        run: npx prisma migrate deploy
      - name: Seed the 300-contract perf fixture
        if: steps.guard.outputs.ready == 'true'
        run: npm run db:seed:slate:perf
      - name: Build
        if: steps.guard.outputs.ready == 'true'
        run: npm run build
      - name: Install Playwright chromium
        if: steps.guard.outputs.ready == 'true'
        run: npx playwright install chromium
      # The measurement signs in with the provisioned accounts, loads the seeded
      # /slate, reads the real LCP web-vital, compares to the committed baseline,
      # and — under PERF_ENFORCE_LCP=1 — fails if the ≥30% reduction is not met.
      # The number, the baseline→current delta, and the pass/fail are printed to
      # the log and written to docs/v1/perf/slate-lcp-latest.json.
      - name: Enforce Slate LCP (≥30% reduction vs baseline)
        if: steps.guard.outputs.ready == 'true'
        run: npm run perf:slate-lcp
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

  python:
    name: Python ingest (unit + DB integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sightline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sightline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sightline?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sightline?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sightline?schema=public
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync Python deps
        run: uv sync
        working-directory: python
      - name: Run tests (import-graph guard, provenance, failure semantics)
        run: uv run pytest -q
        working-directory: python
