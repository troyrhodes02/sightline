name: CI

on:
  push:
    branches: [main, "pitch/**"]
  pull_request:

# Backtests run locally, never in CI (see CLAUDE.md). CI runs the invariant and
# unit/integration suites only.
jobs:
  schema:
    name: Prisma schema invariants
    runs-on: ubuntu-latest
    env:
      # validate does not connect, but prisma.config.ts reads these via env().
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sightline?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sightline?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate schema
        run: npm run prisma:validate
      - name: Schema-introspection invariants
        run: npm run test:schema

  web:
    name: Web app (lint, types, unit, build, e2e)
    runs-on: ubuntu-latest
    env:
      # Placeholders. The web suites never reach Postgres or Supabase — the
      # values exist only so `src/env.ts` parses, which is itself part of what
      # is under test. Nothing here is or may become a real credential.
      DATABASE_URL: postgresql://postgres:postgres@localhost:6543/sightline?pgbouncer=true
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sightline
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Format check
        run: npm run format
      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e -- --project=desktop

  python:
    name: Python ingest (unit + DB integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sightline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sightline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sightline?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sightline?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sightline?schema=public
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync Python deps
        run: uv sync
        working-directory: python
      - name: Run tests (import-graph guard, provenance, failure semantics)
        run: uv run pytest -q
        working-directory: python
