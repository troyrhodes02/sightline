# Local Postgres for the test suite (SIG-6+). Disposable; not the dev database.
# Bring it up, apply migrations, and point TEST_DATABASE_URL at it:
#
#   docker compose up -d db
#   DATABASE_URL=$TEST_DATABASE_URL DIRECT_URL=$TEST_DATABASE_URL npx prisma migrate deploy
#   uv run --project python pytest
#
# Host port is 5433 to avoid colliding with any Postgres already on 5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sightline
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sightline"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - sightline_db_data:/var/lib/postgresql/data

volumes:
  sightline_db_data:
